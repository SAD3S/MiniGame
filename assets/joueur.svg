<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <!-- Sprite du personnage (placeholder minimaliste).
       Il "regarde" vers la DROITE par défaut : le script retourne
       le sprite horizontalement (flip_h) quand on va à gauche.
       POUR CHANGER LE PERSONNAGE : remplacez ce fichier par votre image
       (48x48 conseillé), ou changez la texture dans scenes/joueur.tscn. -->
  <ellipse cx="24" cy="44" rx="14" ry="4" fill="#000000" opacity="0.18"/>
  <circle cx="24" cy="24" r="18" fill="#ff8c42" stroke="#d96b25" stroke-width="3"/>
  <!-- Yeux décalés vers la droite = direction du regard -->
  <circle cx="27" cy="19" r="3.4" fill="#ffffff"/>
  <circle cx="36" cy="19" r="3.4" fill="#ffffff"/>
  <circle cx="28.5" cy="19" r="1.8" fill="#2b2b2b"/>
  <circle cx="37.5" cy="19" r="1.8" fill="#2b2b2b"/>
  <!-- Petit sourire -->
  <path d="M28 30 Q33 34 38 29" stroke="#2b2b2b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
